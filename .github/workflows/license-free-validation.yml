name: License-free validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Optional proposed package tag, for example com.foxsterdev.loqui/0.3.0
        required: false
        type: string

# Supersede older runs of the same PR; keep push/tag/manual evidence independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate repository
        run: python3 scripts/validate_repo.py ${{ inputs.release_tag && format('--release-tag {0}', inputs.release_tag) || '' }}
